<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたしの選ぶちぃの好き顔 結果</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="ちぃむみーてぃんぐ2026">
<meta property="og:title" content="わたしの選ぶちぃの好き顔 結果｜ちぃむみーてぃんぐ2026">
<meta property="og:description" content="ちぃむみーてぃんぐ2026 企画⑥ みんなが選んだ好き顔の結果">
<meta property="og:image" content="/ogp-kikaku6.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/ogp-kikaku6.png">
<meta name="description" content="ちぃちゃん生誕企画「ちぃむみーてぃんぐ2026」企画⑥ わたしの選ぶちぃの好き顔">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --bg:#fff7f9; --surface:#ffffff; --fg:#3b2a33; --muted:#8a7480; --line:#f1d9e2;
  --accent:#e8517f; --accent-ink:#ffffff;
  --w1:#e8517f; --w2:#f08a3c; --w3:#3aa58a; --w4:#5b7fe0; --w5:#a35fd1;
  --t1:#fde7ef; --t2:#ffeede; --t3:#e3f5ee; --t4:#e6ecfd; --t5:#f1e6fb;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1519; --surface:#2a1d23; --fg:#f6e9ee; --muted:#b59aa6; --line:#43303a;
  --accent:#ff7aa2; --accent-ink:#2a0f19;
  --w1:#ff7aa2; --w2:#ffab6b; --w3:#5fd1b0; --w4:#8fa9ff; --w5:#cf96f5;
  --t1:#3a2430; --t2:#3a2c22; --t3:#20332c; --t4:#232a3d; --t5:#2f2439; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1519; --surface:#2a1d23; --fg:#f6e9ee; --muted:#b59aa6; --line:#43303a;
  --accent:#ff7aa2; --accent-ink:#2a0f19;
  --w1:#ff7aa2; --w2:#ffab6b; --w3:#5fd1b0; --w4:#8fa9ff; --w5:#cf96f5;
  --t1:#3a2430; --t2:#3a2c22; --t3:#20332c; --t4:#232a3d; --t5:#2f2439; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.back{font-family:var(--display);font-weight:800;font-size:14px;color:var(--accent);text-decoration:none;align-self:flex-start}
.back:hover,.back:focus-visible{text-decoration:underline}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.5vw,36px);line-height:1.25;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{margin:0;font-family:var(--display);font-weight:800;font-size:16px}
.lead{margin:0;color:var(--muted);font-size:14px}
.status{font-size:13px;color:var(--muted);margin:0}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
button,a,input{touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:16px;border:0;border-radius:999px;padding:11px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.sub2{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(20,10,15,.86);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.viewer figure{margin:0;max-width:min(560px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.viewer img{max-width:100%;max-height:68vh;border-radius:16px;background:#000}
.viewer figcaption{color:#fff;text-align:center;font-size:15px}
.viewer .close{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:12px;font:inherit;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}

.lock{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock .ic{font-size:40px;line-height:1}
.lock b{font-family:var(--display);font-size:18px}
.meta{font-size:13px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
/* 上位3つ */
.podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:end}
.pd{position:relative;padding-top:14px!important;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit}
.pd .fr{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:4px solid var(--c);background:var(--line);box-shadow:0 10px 24px rgba(80,30,50,.16)}
.pd img{width:100%;height:100%;object-fit:cover;display:block}
.pd .rk{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:14px;background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.pd .vt{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pd .vt small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-left:4px}
.pd .cp{font-size:12px;color:var(--muted);line-height:1.4;min-height:1.4em}
.pd.r1 .vt{font-size:18px}
.mybadge{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px}
/* 4位から */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;cursor:pointer}
.row .n{flex:none;width:30px;text-align:center;font-family:var(--display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.row img{flex:none;width:48px;height:64px;object-fit:cover;border-radius:10px;background:var(--line)}
.row .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .tp{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.row .tp b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .cp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.row .gb{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.row .gb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--w1),var(--w5));transition:width .6s ease}
.row.mine{border-color:var(--accent)}
.row .me{font-size:10px;font-weight:700;color:var(--accent);white-space:nowrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/kikaku6">← 投票ページへ</a>
  <header>
    <h1>わたしの選ぶ<span>ちぃ</span>の好き顔<br>結果発表</h1>
    <p class="sub">みんなが選んだ好き顔🗳️</p>
  </header>
  <div class="lock" id="lock" hidden>
    <span class="ic">🔒</span>
    <b>投票すると結果が見られます</b>
    <p class="status">好きな表情を3つえらんで投票してね。</p>
    <a class="btn" href="/kikaku6">投票しに行く →</a>
  </div>
  <div id="res" hidden style="display:flex;flex-direction:column;gap:22px">
    <p class="meta" id="meta"></p>
    <div class="podium" id="podium"></div>
    <ul class="rows" id="rows"></ul>
    <div class="acts"><a class="btn sub2" href="/kikaku6">選び直す</a></div>
  </div>
  <p class="status" id="status">読み込み中…</p>
  <footer>※ファンによる非公式サイトです</footer>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真を大きく見る">
  <button class="close" type="button" id="vclose">閉じる ✕</button>
  <figure><img id="vimg" alt=""><figcaption id="vcap"></figcaption></figure>
</div>
<script>
const $=id=>document.getElementById(id);
let ver=-1, timer=null;
const img=(id,s)=>`/api/kao/img?id=${id}${s?"&s="+s:""}`;
const COLORS=["#e8a33c","#9aa5b4","#c27c4e"];   // 金・銀・銅
function view(p,label){ $("vimg").src=img(p.id,"full"); $("vcap").textContent=label; $("viewer").hidden=false; }
$("vclose").onclick=()=>$("viewer").hidden=true;
$("viewer").addEventListener("click",e=>{ if(e.target===$("viewer")) $("viewer").hidden=true; });
function render(d){
  const ps=d.photos||[], voters=d.voters||0, mine=new Set(d.mine||[]);
  // 同じ票数は同じ順位
  let rank=0, prev=-1; ps.forEach((p,i)=>{ if(p.n!==prev){ rank=i+1; prev=p.n; } p.rank=rank; });
  const pct=p=>voters?Math.round(p.n/voters*100):0;
  $("meta").textContent=`${voters}人が投票（1人3票）・自動で更新されます`;
  const top=ps.slice(0,3), order=[1,0,2].filter(i=>top[i]);
  $("podium").replaceChildren(...order.map(i=>{
    const p=top[i], b=document.createElement("button"); b.type="button"; b.className="pd r"+p.rank;
    b.style.setProperty("--c",COLORS[Math.min(p.rank,3)-1]);
    const label=`${p.rank}位 ${p.n}票${p.caption?"　"+p.caption:""}`;
    b.setAttribute("aria-label",label);
    b.innerHTML=`<span class="rk">${p.rank===1?"👑 ":""}${p.rank}位</span><div class="fr"><img alt="" src="${img(p.id)}">${mine.has(p.id)?'<span class="mybadge">あなたの1票</span>':""}</div><div class="vt">${p.n}票<small>${pct(p)}%</small></div>`;
    const cp=document.createElement("div"); cp.className="cp"; cp.textContent=p.caption||""; b.append(cp);
    b.onclick=()=>view(p,label);
    return b;
  }));
  const max=Math.max(1,...ps.map(p=>p.n));
  $("rows").replaceChildren(...ps.slice(3).map(p=>{
    const li=document.createElement("li"); li.className="row"+(mine.has(p.id)?" mine":"");
    li.innerHTML=`<span class="n">${p.rank}</span><img alt="" loading="lazy" src="${img(p.id)}"><div class="bd"><div class="tp"><span class="cp"></span><b>${p.n}票 <small>${pct(p)}%</small></b></div><div class="gb"><i style="width:${p.n/max*100}%"></i></div></div>`;
    li.querySelector(".cp").textContent=p.caption||(mine.has(p.id)?"":"");
    if(mine.has(p.id)){ const m=document.createElement("span"); m.className="me"; m.textContent="あなたの1票"; li.querySelector(".cp").append(m); }
    li.onclick=()=>view(p,`${p.rank}位 ${p.n}票${p.caption?"　"+p.caption:""}`);
    return li;
  }));
}
async function load(){
  try{
    const r=await fetch("/api/kao/result?v="+ver,{cache:"no-store"});
    const d=await r.json().catch(()=>({}));
    if(r.status===403&&d.needVote){ $("lock").hidden=false; $("res").hidden=true; $("status").textContent=""; return false; }
    if(!r.ok) throw 0;
    $("status").textContent="";
    if(d.same) return true;
    ver=d.ver; $("lock").hidden=true; $("res").hidden=false; render(d); return true;
  }catch(e){ $("status").textContent="読み込めませんでした。自動でつなぎ直しています…"; return true; }
}
async function loop(){ const go=await load(); if(go){ clearTimeout(timer); timer=setTimeout(()=>{ if(!document.hidden) loop(); else setTimeout(loop,3000); },8000); } }
loop();
</script>
</body>
</html>
