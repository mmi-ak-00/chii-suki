<script>
const $ = id => document.getElementById(id);
// ===== 生誕企画の設定（ここを書き換えると企画を足せます） =====
const BIRTHDAY = { month: 11, day: 2 };           // ちぃちゃんのお誕生日
// 企画のリストはサーバー（_worker.js）で管理しています。下はプレビュー用の見本です。
const SAMPLE_PROJECTS = [
  { open: true, title: "聖ちぃ巡礼マップ", desc: "ちぃちゃんの足跡をめぐろう🐾", href: "https://seichii-map.pages.dev", external: true },
  { open: false, soon: "10/27公開予定" },
];
let PROJECTS = [];

function drawMenu(){
  const NUM="①②③④⑤⑥⑦⑧⑨⑩";
  $("menu").replaceChildren(...PROJECTS.map((p,i)=>{
    const open=p.open && p.href;
    const el=document.createElement(open?"a":"div");
    if(open){ el.href=p.href; if(p.external){ el.className="ext"; el.target="_blank"; el.rel="noopener"; } }
    else el.className="soon";
    const k=document.createElement("span"); k.className="k"; k.textContent="企画"+(NUM[i]||String(i+1));
    const t=document.createElement("span"); t.className="t"; t.textContent=open?p.title:"COMING SOON";
    const d=document.createElement("span"); d.className="d"; d.textContent=open?p.desc:(p.soon||"おたのしみに…！");
    el.append(k,t,d); return el;
  }));
}
async function loadProjects(){
  try{
    const r=await fetch("/api/projects",{cache:"no-store"});
    if(!r.ok) throw 0;
    PROJECTS=(await r.json()).projects;
  }catch(e){ PROJECTS=SAMPLE_PROJECTS; }
  drawMenu();
}
function drawCountdown(){
  // 日本時間で計算。この生誕企画は2026年のお誕生日（11/2）に向けたもの
  const now=new Date(Date.now()+9*3600e3);
  const today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  const bd=Date.UTC(2026,BIRTHDAY.month-1,BIRTHDAY.day);
  const days=Math.round((bd-today)/864e5);
  const box=$("countdown");
  box.classList.toggle("after",days<0);
  if(days===0){ box.innerHTML='<span class="n">HAPPY BIRTHDAY</span><span class="sub">ちぃちゃん、お誕生日おめでとう！</span>'; return; }
  if(days<0){
    // お誕生日が終わったあと：お礼と、24歳の1年への応援
    box.innerHTML='<span class="n">24歳もよろしくね💗</span><span class="sub">ちぃちゃん、24歳のお誕生日おめでとう！<br>生誕企画に参加してくれたみなさん、ありがとうございました🎉</span>';
    return;
  }
  box.innerHTML=`<span class="u">お誕生日まで あと</span><span class="n">${days}</span><span class="u">日</span>`;
}

// 紙吹雪（毎回同じ配置）
(function(){
  const C=["--w1","--w2","--w3","--w4","--w5"];
  const spots=[[8,30],[22,62],[90,34],[78,58],[60,22],[94,78],[4,82],[40,90],[70,88],[30,18],[52,70],[86,12],[14,48],[96,52]];
  $("confetti").replaceChildren(...spots.map(([x,y],i)=>{
    const b=document.createElement("b");
    const sz=6+(i*7)%7;
    b.style.cssText=`left:${x}%;top:${y}%;width:${sz}px;height:${i%3===0?sz:Math.round(sz*0.45)}px;background:var(${C[i%5]});border-radius:${i%3===0?"50%":"2px"};--r:${(i*47)%180}deg;animation-delay:${-(i*0.7)}s`;
    return b;
  }));
})();
loadProjects(); drawCountdown(); setInterval(drawCountdown, 60e3);

// ===== 11/2限定：真っ白な画面がキラキラ〜っと溶けてトップページが見えてきて、両サイドからクラッカーが出てきて「パーン！」 =====
// URLに ?pan を付けると、当日でなくても試せる
(function(){
  const now=new Date(Date.now()+9*3600e3);
  const isBirthday=now.getUTCFullYear()===2026&&now.getUTCMonth()===10&&now.getUTCDate()===2;
  if(!isBirthday && !/[?&]pan/.test(location.search)) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ① 最初は真っ白な幕でページをかくしておく
  const veil=document.createElement("div");
  veil.style.cssText="position:fixed;inset:0;z-index:98;background:radial-gradient(ellipse at 50% 40%,#fffdfb 0%,#fff6f0 55%,#fbe9f0 100%);pointer-events:none";
  document.body.append(veil);

  const cv=document.createElement("canvas");
  cv.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100";
  document.body.append(cv);
  const g=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0; const size=()=>{ W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener("resize",size);
  const css=getComputedStyle(document.documentElement);
  const COLS=["--w1","--w2","--w3","--w4","--w5"].map(v=>css.getPropertyValue(v).trim()||"#e8517f").concat(["#ffd54a","#ffffff"]);
  // シャンパンゴールドとローズゴールドの、細い光のキラキラ
  const GLOW=["#d9a441","#e8bd62","#e07f9c","#c99a3c","#eb98b0"];

  // キラキラ（4つの角がある星）。白い幕の上で光って、幕が溶けるのといっしょに消えていく
  const S=[];
  // 大きい光（少しだけ）と、こまかい光のつぶ（たくさん）
  const NS=reduce?10:26, ND=reduce?36:110;
  for(let i=0;i<NS;i++) S.push({x:Math.random(),y:Math.random(),t:Math.random()*2000,life:900+Math.random()*700,r:26+Math.random()*(i%4===0?44:22),c:GLOW[i%GLOW.length],rot:(Math.random()-.5)*0.3,big:1});
  for(let i=0;i<ND;i++) S.push({x:Math.random(),y:Math.random(),t:Math.random()*2300,life:500+Math.random()*700,r:1+Math.random()*2,c:GLOW[i%GLOW.length],rot:0,big:0});
  function line(len,wid,c){
    const grd=g.createLinearGradient(0,-len,0,len);
    grd.addColorStop(0,"rgba(255,255,255,0)"); grd.addColorStop(.5,c); grd.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=grd; g.beginPath(); g.moveTo(0,-len); g.quadraticCurveTo(wid,0,0,len); g.quadraticCurveTo(-wid,0,0,-len); g.fill();
  }
  function star(x,y,r,a,c,rot,big){
    g.save(); g.translate(x,y); g.globalAlpha=a;
    if(!big){   // 光のつぶ
      g.shadowColor=c; g.shadowBlur=6; g.fillStyle=c; g.beginPath(); g.arc(0,0,r,0,6.28); g.fill();
      g.restore(); return;
    }
    // やわらかい光のにじみ
    const glow=g.createRadialGradient(0,0,0,0,0,r*0.9); glow.addColorStop(0,c); glow.addColorStop(1,"rgba(255,255,255,0)");
    g.globalAlpha=a*.45; g.fillStyle=glow; g.beginPath(); g.arc(0,0,r*0.9,0,6.28); g.fill();
    g.globalAlpha=a; g.rotate(rot);
    line(r,r*0.09,c); line(r*0.6,r*0.05,"#fffdf6");                 // たての細い光
    g.rotate(Math.PI/2); line(r*0.72,r*0.08,c); line(r*0.45,r*0.04,"#fffdf6");   // よこの細い光
    g.rotate(Math.PI/4); line(r*0.32,r*0.04,c); g.rotate(Math.PI/2); line(r*0.32,r*0.04,c);   // ななめの短い光
    g.shadowColor=c; g.shadowBlur=10; g.fillStyle="#fffdf6"; g.beginPath(); g.arc(0,0,Math.max(1.4,r*0.07),0,6.28); g.fill();   // まん中の白い点
    g.restore();
  }

  // 紙吹雪（クラッカーから飛び出す）
  const P=[];
  function burst(x,y,deg,n,spread){
    for(let i=0;i<n;i++){
      const ang=(deg+(Math.random()-.5)*(spread||40))*Math.PI/180, sp=(Math.sqrt(H/844)*(reduce?24:30))+Math.random()*12;   // 画面のいちばん上まで届く強さ
      P.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,c:COLS[i%COLS.length],w:6+Math.random()*6,h:8+Math.random()*8,
        r:Math.random()*6.28,vr:(Math.random()-.5)*.3,shape:Math.random()<.25?"o":"r",sw:Math.random()*6.28});
    }
  }

  const st=document.createElement("style");
  st.textContent=`

.popper.l.ready{transition:transform .25s ease-in;transform:translate(4px,8px) rotate(26deg) scale(.94)} .popper.r.ready{transition:transform .25s ease-in;transform:translate(-4px,8px) rotate(-26deg) scaleX(-1) scale(.94)}
.popper.l.kick{transition:transform .12s ease-out;transform:translate(-10px,14px) rotate(38deg) scale(1.06)} .popper.r.kick{transition:transform .12s ease-out;transform:translate(10px,14px) rotate(-38deg) scaleX(-1) scale(1.06)}
.popper.l.out{transition:transform .5s ease-in;transform:translate(-180px,160px) rotate(32deg)} .popper.r.out{transition:transform .5s ease-in;transform:translate(180px,160px) rotate(-32deg) scaleX(-1)}
.popper svg{position:absolute;left:0;top:0;width:84px;height:110px;overflow:visible}
.popper .mouth{position:absolute;left:42px;top:6px;width:1px;height:1px}
.pan{position:fixed;z-index:103;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(22px,6.5vw,36px);color:var(--accent);text-shadow:0 2px 0 #fff,0 0 12px #fff;white-space:nowrap;animation:pan 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pan{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--rt));opacity:0}30%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--rt));opacity:1}70%{opacity:1}100%{transform:translate(-50%,-80%) scale(1) rotate(var(--rt));opacity:0}}
.flash{position:fixed;z-index:101;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6 35%,#ffd54a33 60%,transparent 70%);animation:flash .5s ease-out both}
@keyframes flash{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
.hbtxt::before{content:"";position:absolute;left:50%;top:50%;width:150%;height:190%;transform:translate(-50%,-50%);z-index:-1;background:radial-gradient(ellipse at center,rgba(255,255,255,.92) 0%,rgba(255,250,240,.75) 40%,rgba(255,255,255,0) 70%)}
.hbtxt{position:fixed;left:50%;top:46%;z-index:103;pointer-events:none;text-align:center;white-space:nowrap;transform:translate(-50%,-50%);animation:hbin 3.4s ease both}
.hbtxt b{display:block;font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;font-weight:400;font-size:clamp(44px,13.5vw,84px);line-height:1.15;padding:0 .2em;
  background:linear-gradient(100deg,#b8862f 0%,#e9c46a 30%,#fff6d8 45%,#e9c46a 60%,#c08a2e 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.95)) drop-shadow(0 0 14px rgba(255,255,255,.9)) drop-shadow(0 3px 10px rgba(160,110,30,.25));animation:hbshine 2.4s ease .3s both}
.hbtxt span{display:block;margin-top:2px;font-family:var(--display);font-weight:800;font-size:clamp(12px,3.4vw,15px);letter-spacing:.32em;color:#c99a3c;text-shadow:0 0 8px #fff,0 0 2px #fff}
@keyframes hbin{0%{opacity:0;transform:translate(-50%,-40%) scale(.92);filter:blur(6px)}18%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1.02);filter:blur(2px)}}
@keyframes hbshine{from{background-position:100% 0}to{background-position:0 0}}`;
  document.head.append(st);

  const CONE='<svg viewBox="0 0 84 110" aria-hidden="true"><defs><clipPath id="cc"><path d="M10 10 L74 10 L48 104 L36 104 Z"/></clipPath></defs>'
    +'<g clip-path="url(#cc)"><rect x="0" y="0" width="84" height="110" fill="#e8517f"/>'
    +'<path d="M0 26 L84 14 L84 30 L0 42Z M0 58 L84 46 L84 62 L0 74Z M0 90 L84 78 L84 94 L0 106Z" fill="#ffd54a"/></g>'
    +'<ellipse cx="42" cy="10" rx="32" ry="7" fill="#5b7fe0"/><ellipse cx="42" cy="10" rx="25" ry="4.5" fill="#3d5bb8"/>'
    +'<rect x="34" y="100" width="16" height="8" rx="3" fill="#a35fd1"/></svg>';
  function makePopper(side){
    const d=document.createElement("div"); d.className="popper "+side;
    d.innerHTML=CONE+'<span class="mouth"></span>';
    document.body.append(d); return d;
  }
  // パーンに合わせて、金色の筆記体で「Happy Birthday」
  function hb(){
    const d=document.createElement("div"); d.className="hbtxt";
    d.innerHTML='<b>Happy Birthday</b><span>CHII ・ 2026.11.02</span>';
    document.body.append(d); setTimeout(()=>d.remove(),3600);
  }
  function bang(p,side){
    const m=p.querySelector(".mouth").getBoundingClientRect(), x=m.left, y=m.top;
    burst(x,y,side==="l"?-58:-122,reduce?50:120,46);   // クラッカーの口が向いている方へ
    const f=document.createElement("div"); f.className="flash"; f.style.left=x+"px"; f.style.top=y+"px"; document.body.append(f); setTimeout(()=>f.remove(),600);
    // 文字は真ん中に1回だけ（hb()で出す）
  }

  // ② 白い幕を、真ん中からまるく溶かしていく（キラキラの下からページが見えてくる）
  const REVEAL_AT=1000, REVEAL_LEN=reduce?400:1500, BANG_AT=reduce?1300:3300, END=BANG_AT+5200;
  let t0=0;
  function frame(t){
    if(!t0) t0=t;
    const el=t-t0;
    const maxR=Math.hypot(W,H);
    const k=Math.max(0,Math.min(1,(el-REVEAL_AT)/REVEAL_LEN)), e=k*k*(3-2*k);
    if(k<1){
      const band=Math.max(60,maxR*0.25), R=e*(maxR+band);   // R=0のときは全面まっ白
      const m=`radial-gradient(circle at 50% 40%, transparent ${R-band}px, #000 ${R}px)`;
      veil.style.webkitMaskImage=m; veil.style.maskImage=m;
      veil.style.opacity=String(1-e*0.35);
    } else if(veil.isConnected) veil.remove();
    g.clearRect(0,0,W,H);
    // キラキラ
    for(const s of S){
      const q=(el-s.t)/s.life; if(q<0||q>1) continue;
      const a=Math.sin(q*Math.PI);
      star(s.x*W,s.y*H,s.r*(s.big?0.5+0.5*a:1),a,s.c,s.rot+q*0.25,s.big);
    }
    // 紙吹雪
    const fade=Math.max(0,Math.min(1,(END-el)/1000));
    for(const p of P){
      p.vy+=0.32; p.vx*=0.975; p.vy*=0.975; if(p.vy>2.6) p.vy=2.6; p.x+=Math.sin(p.sw)*0.6;
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.sw+=0.15;
      g.save(); g.globalAlpha=fade; g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c;
      if(p.shape==="o"){ g.beginPath(); g.arc(0,0,p.w/2,0,6.28); g.fill(); }
      else g.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.sw)),p.w,p.h*Math.abs(Math.cos(p.sw))+1);
      g.restore();
    }
    if(el<END) requestAnimationFrame(frame); else { cv.remove(); if(veil.isConnected) veil.remove(); }
  }
  function go(){
    requestAnimationFrame(frame);
    if(reduce){ setTimeout(()=>{ burst(0,H,-60,40,40); burst(W,H,-120,40,40); hb(); $("countdown").classList.add("bdpop"); },BANG_AT); return; }
    const L=makePopper("l"), R=makePopper("r");
    // ③ ページが見えてきたら、両サイドからクラッカーが出てくる
    setTimeout(()=>{ L.classList.add("in"); R.classList.add("in"); },BANG_AT-900);
    setTimeout(()=>{ L.classList.add("ready"); R.classList.add("ready"); },BANG_AT-280);   // ぐっとためて
    setTimeout(()=>{                                                                         // ④ パーン！
      L.classList.remove("ready"); R.classList.remove("ready"); L.classList.add("kick"); R.classList.add("kick");
      bang(L,"l"); bang(R,"r"); hb();
      const box=$("countdown"); box.classList.remove("bdpop"); void box.offsetWidth; box.classList.add("bdpop");
    },BANG_AT);
    setTimeout(()=>{ L.classList.remove("kick"); R.classList.remove("kick"); },BANG_AT+200);
    setTimeout(()=>{ L.classList.add("out"); R.classList.add("out"); },BANG_AT+1300);         // ⑤ 引っこむ
    setTimeout(()=>{ L.remove(); R.remove(); },BANG_AT+1900);
  }
  if(document.readyState==="complete") setTimeout(go,50); else addEventListener("load",()=>setTimeout(go,50));
})();
</script>
