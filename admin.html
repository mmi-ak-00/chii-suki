<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>好きなところ 管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#fff7f9;--surface:#fff;--fg:#3b2a33;--muted:#8a7480;--line:#f1d9e2;--accent:#e8517f;--ink:#fff;--warn:#c0392b}
@media (prefers-color-scheme: dark){:root{--bg:#1f1519;--surface:#2a1d23;--fg:#f6e9ee;--muted:#b59aa6;--line:#43303a;--accent:#ff7aa2;--ink:#2a0f19;--warn:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-size:24px;margin:0}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--accent);color:var(--ink)}
button.sub{background:var(--line);color:var(--fg)}
button.del{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.msg{color:var(--muted);min-height:1.4em;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{outline:2px solid var(--fg)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
li.hid{opacity:.55}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border-radius:10px 10px 0 0;padding:8px 14px}
.tabs button[aria-selected="true"]{background:var(--line);color:var(--fg)}
.letter{flex-direction:column;align-items:stretch}
.letter .who{font-weight:700}
.letter .body{white-space:pre-wrap;overflow-wrap:anywhere}
.letter .acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#copyout{width:100%;min-height:160px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
li .t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
li .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pj{align-items:center}
.pj .st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pj .st.on{background:var(--accent);color:var(--ink)}
.pj .st.off{background:var(--line);color:var(--muted)}
.pv{font-weight:700;font-size:14px;color:var(--accent)}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>好きなところ 管理ページ</h1>
  <form id="login">
    <input id="key" type="password" placeholder="管理用の合言葉" autocomplete="current-password" aria-label="管理用の合言葉">
    <button type="submit">ひらく</button>
  </form>
  <p class="msg" id="msg">合言葉を入れると投稿の一覧が出ます。「かくす」にした投稿はみんなの画面から消えます。</p>
  <div class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" data-tab="posts" aria-selected="true">ひとこと</button>
    <button role="tab" data-tab="letters" aria-selected="false">メッセージ</button>
    <button role="tab" data-tab="projects" aria-selected="false">企画</button>
  </div>
  <section id="lettersView" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="msg" id="lmsg"></p>
    <div class="filters">
      <button id="copyall" type="button">全部まとめてコピー</button>
      <button class="sub" id="lreload" type="button">更新</button>
    </div>
    <textarea id="copyout" hidden readonly aria-label="コピー用テキスト"></textarea>
    <ul id="letters"></ul>
  </section>
  <section id="projectsView" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="msg" id="pmsg">「公開する」を押した企画だけがトップに表示されます。公開前の企画は「COMING SOON」と番号だけが出ます。「プレビューで見る」から、公開前のページをあなただけ確認できます。</p>
    <ul id="projects"></ul>
  </section>
  <div id="postsView" style="display:flex;flex-direction:column;gap:16px">
  <div class="filters" id="filters" hidden>
    <button class="sub" data-f="all" aria-pressed="true">すべて</button>
    <button class="sub" data-f="hidden" aria-pressed="false">かくした投稿</button>
    <button class="sub" id="reload" type="button">更新</button>
  </div>
  <ul id="list"></ul>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let key="", rows=[], filter="all", pendingDel=null;
try{ key=sessionStorage.getItem("k")||""; }catch(e){}
async function call(action,id,extra){
  const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key,action,id,...(extra||{})})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||"うまくいきませんでした。");
  return d;
}
async function refresh(){
  try{
    const d=await call("list"); rows=d.posts;
    try{ sessionStorage.setItem("k",key); }catch(e){}
    $("login").hidden=true; $("filters").hidden=false; $("tabs").hidden=false;
    $("msg").textContent=`${rows.length}件の投稿（かくしている投稿 ${rows.filter(r=>r.hidden).length}件）`;
    draw();
  }catch(e){ $("msg").textContent=e.message; $("login").hidden=false; }
}
function draw(){
  const view=filter==="hidden"?rows.filter(r=>r.hidden):rows;
  $("list").replaceChildren(...view.map(r=>{
    const li=document.createElement("li"); if(r.hidden) li.className="hid";
    const t=document.createElement("span"); t.className="t"; t.textContent=r.text;
    const m=document.createElement("span"); m.className="m"; m.textContent=new Date(r.at).toLocaleString("ja-JP");
    const tog=document.createElement("button"); tog.className="sub";
    tog.textContent=r.hidden?"もどす":"かくす";
    tog.onclick=async()=>{ try{ await call(r.hidden?"show":"hide",r.id); await refresh(); }catch(e){ $("msg").textContent=e.message; } };
    const del=document.createElement("button"); del.className="del";
    del.textContent=pendingDel===r.id?"本当に消す":"消す";
    del.onclick=async()=>{
      if(pendingDel!==r.id){ pendingDel=r.id; draw(); return; }
      pendingDel=null;
      try{ await call("delete",r.id); await refresh(); }catch(e){ $("msg").textContent=e.message; }
    };
    const parts=[t,m];
    if(r.hidden){ const g=document.createElement("span"); g.className="tag"; g.textContent="かくし中"; parts.push(g); }
    li.append(...parts,tog,del); return li;
  }));
}
$("login").addEventListener("submit",e=>{ e.preventDefault(); key=$("key").value; refresh(); });
$("filters").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="reload"){ refresh(); return; }
  filter=b.dataset.f;
  for(const x of $("filters").querySelectorAll("[data-f]")) x.setAttribute("aria-pressed",x===b);
  draw();
});
let letters=[], pendingL=null;
const fmt=at=>new Date(at).toLocaleString("ja-JP");
async function loadLetters(){
  try{ const d=await call("letters"); letters=d.letters; drawLetters(); }
  catch(e){ $("lmsg").textContent=e.message; }
}
function drawLetters(){
  $("lmsg").textContent=letters.length?`${letters.length}通のメッセージ（古い順）。ここだけで読めて、サイトには表示されません。`:"まだメッセージは届いていません。";
  $("letters").replaceChildren(...letters.map(l=>{
    const li=document.createElement("li"); li.className="letter";
    const who=document.createElement("span"); who.className="who"; who.textContent=l.name||"（名前なし）";
    const body=document.createElement("div"); body.className="body"; body.textContent=l.message;
    const acts=document.createElement("div"); acts.className="acts";
    const m=document.createElement("span"); m.className="m"; m.textContent=fmt(l.at);
    const del=document.createElement("button"); del.className="del";
    del.textContent=pendingL===l.id?"本当に消す":"消す";
    del.onclick=async()=>{
      if(pendingL!==l.id){ pendingL=l.id; drawLetters(); return; }
      pendingL=null;
      try{ await call("delete_letter",l.id); await loadLetters(); }catch(e){ $("lmsg").textContent=e.message; }
    };
    acts.append(m,del); li.append(who,body,acts); return li;
  }));
}
$("copyall").addEventListener("click",async()=>{
  const text=letters.map(l=>`【${l.name||"名前なし"}】\n${l.message}`).join("\n\n――――――――\n\n");
  const out=$("copyout"); out.value=text;
  try{ await navigator.clipboard.writeText(text); $("lmsg").textContent=`${letters.length}通をコピーしました。メモアプリなどに貼り付けてください。`; out.hidden=true; }
  catch(e){ out.hidden=false; out.focus(); out.select(); $("lmsg").textContent="下の枠の文字を全選択してコピーしてください。"; }
});
$("lreload").addEventListener("click",loadLetters);
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  for(const x of $("tabs").querySelectorAll("[data-tab]")) x.setAttribute("aria-selected",x===b);
  const tab=b.dataset.tab;
  $("lettersView").hidden=tab!=="letters"; $("projectsView").hidden=tab!=="projects";
  $("postsView").hidden=tab!=="posts"; $("msg").hidden=tab!=="posts";
  if(tab==="letters") loadLetters();
  if(tab==="projects") loadProjects();
});
const NUM="①②③④⑤⑥⑦⑧⑨⑩";
async function loadProjects(){
  try{
    const d=await call("projects");
    $("projects").replaceChildren(...d.projects.map((p,i)=>{
      const li=document.createElement("li"); li.className="pj";
      const t=document.createElement("span"); t.className="t";
      t.textContent=`企画${NUM[i]||i+1}　${p.title}`;
      const st=document.createElement("span"); st.className="st "+(p.open?"on":"off"); st.textContent=p.open?"公開中":"COMING SOON";
      const btn=document.createElement("button"); btn.className=p.open?"sub":"";
      btn.textContent=p.open?"非公開にもどす":"公開する";
      btn.onclick=async()=>{
        btn.disabled=true;
        try{ await call("set_project",null,{pid:p.id,open:!p.open}); $("pmsg").textContent=`企画${NUM[i]||i+1}を${p.open?"非公開にしました":"公開しました"}。`; await loadProjects(); }
        catch(e){ $("pmsg").textContent=e.message; btn.disabled=false; }
      };
      const parts=[t,st,btn];
      if(p.href){
        const full=new URL(p.href,location.origin).toString();
        const cp=document.createElement("button"); cp.className="sub"; cp.type="button"; cp.textContent="URLをコピー";
        cp.onclick=async()=>{
          try{ await navigator.clipboard.writeText(full); cp.textContent="コピーしました！"; setTimeout(()=>cp.textContent="URLをコピー",1800); }
          catch(e){ $("pmsg").textContent="コピーできなかったので、このURLを長押ししてコピーしてください："+full; }
        };
        const u=document.createElement("span"); u.className="m"; u.style.flexBasis="100%"; u.style.overflowWrap="anywhere"; u.textContent=full;
        parts.push(cp,u);
      }
      if(p.page){
        const pv=document.createElement("a"); pv.className="pv"; pv.href="/"+p.page; pv.target="_blank"; pv.rel="noopener";
        pv.textContent=p.open?"ページを開く":"プレビューで見る";
        parts.push(pv);
      }
      li.append(...parts); return li;
    }));
  }catch(e){ $("pmsg").textContent=e.message; }
}
if(key) refresh();
</script>
</body>
</html>
